<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>智慧建築標章計分工具</title>
<meta name="description" content="依 2024 版智慧建築評估手冊的試算工具：勾選評估項目，即時掌握總分、標章等級與缺口。">
<style>
/* 智慧建築標章計分工具 — 樣式
 * 設計原則：專業工程管理工具；顏色只用來表達狀態與等級，狀態一律同時有文字與圖示。 */
:root {
  --bg: #e8ecf2; --sf: #ffffff; --sf2: #f3f6fa; --hd: #2c4160; --hdt: #ffffff; --tx: #142033; --mu: #586a80; --bd: #d6dde8;
  --ac: #1b5fc1; --acs: #e5eefb; --ont: #ffffff;
  --ok: #17794f; --oks: #e4f4ec; --warn: #8a5a00; --warns: #fdf1d8; --bad: #b0281c; --bads: #fbe7e4;
  --base: #1b5fc1; --bonus: #0d857a;
  --g0: #2e8b57; --g1: #a8643a; --g2: #6a7789; --g3: #a47a08; --g4: #1b6fd6;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0f16; --sf: #151d28; --sf2: #1b2532; --hd: #2a4262; --hdt: #eaf1fb; --tx: #e6ecf4; --mu: #9aa9bc; --bd: #2a3647;
    --ac: #6aa5ff; --acs: #182b49; --ont: #07162b;
    --ok: #4cc58b; --oks: #123326; --warn: #e0b34a; --warns: #3a2d0e; --bad: #ff8b7f; --bads: #3d1a17;
    --base: #6aa5ff; --bonus: #3fcfc0;
    --g0: #4cc58b; --g1: #e0956a; --g2: #a9b4c4; --g3: #e2b83c; --g4: #62a6ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0f16; --sf: #151d28; --sf2: #1b2532; --hd: #2a4262; --hdt: #eaf1fb; --tx: #e6ecf4; --mu: #9aa9bc; --bd: #2a3647;
  --ac: #6aa5ff; --acs: #182b49; --ont: #07162b;
  --ok: #4cc58b; --oks: #123326; --warn: #e0b34a; --warns: #3a2d0e; --bad: #ff8b7f; --bads: #3d1a17;
  --base: #6aa5ff; --bonus: #3fcfc0;
  --g0: #4cc58b; --g1: #e0956a; --g2: #a9b4c4; --g3: #e2b83c; --g4: #62a6ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.55 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 固定區 ---------- */
.stick { position: sticky; top: 0; z-index: 20; background: var(--sf); border-bottom: 1px solid var(--bd); box-shadow: 0 1px 0 rgba(0, 0, 0, .02); }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 16px; }
.top h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: .02em; white-space: nowrap; }
.top .sp { margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--bd); border-radius: 8px; overflow: hidden; background: var(--sf); max-width: 100%; }
.seg button { border: 0; background: transparent; padding: 5px 12px; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--bd); }
.seg button[aria-pressed="true"] { background: var(--ac); color: var(--ont); font-weight: 600; }
.catrow { display: flex; align-items: center; gap: 8px; padding: 0 16px 8px; overflow-x: auto; }
.catrow[hidden] { display: none; }
.catrow .lb { color: var(--mu); font-size: 13px; white-space: nowrap; }
.bt { border: 1px solid var(--bd); background: var(--sf); border-radius: 8px; padding: 5px 11px; white-space: nowrap; }
@media (hover: hover) { .bt:hover { background: var(--sf2); } }
.bt.pri { background: var(--ac); border-color: var(--ac); color: var(--ont); font-weight: 600; }
.bt.dng { color: var(--bad); }
.bt.sm { padding: 2px 9px; font-size: 13px; }
.proj { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.savest { font-size: 12.5px; color: var(--mu); white-space: nowrap; }
.savest.err { color: var(--bad); font-weight: 600; }

/* ---------- 儀表板 ---------- */
#dash { display: grid; grid-template-columns: 132px minmax(0, 1.1fr) minmax(0, 1fr); gap: 10px 22px; align-items: center; padding: 10px 16px 12px; border-top: 1px solid var(--bd); }
#dash[hidden] { display: none; }
.ring svg { width: 132px; height: 132px; display: block; }
.ring .tr { fill: none; stroke: var(--sf2); stroke-width: 11; }
.ring .pr { fill: none; stroke: var(--gc, var(--ac)); stroke-width: 11; transition: stroke-dasharray .3s; }
.ring .tk { stroke: var(--tx); stroke-width: 2; opacity: .5; }
.ring .big { font-size: 32px; font-weight: 700; text-anchor: middle; fill: var(--tx); font-variant-numeric: tabular-nums; }
.ring .sm { font-size: 11px; text-anchor: middle; fill: var(--mu); }
.gmain { min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 16px; border-radius: 999px; font-size: 20px; font-weight: 700; color: var(--gc, var(--mu)); border: 2px solid var(--gc, var(--bd)); background: color-mix(in srgb, var(--gc, var(--mu)) 12%, var(--sf)); }
.gmain p { margin: 6px 0 0; font-size: 14px; color: var(--mu); }
.gmain p b { color: var(--tx); }
.ladder { position: relative; margin: 14px 4px 40px 0; height: 8px; background: var(--sf2); border-radius: 4px; border: 1px solid var(--bd); }
.ladder i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--gc, var(--ac)); }
.ladder u { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--tx); opacity: .55; text-decoration: none; }
.ladder u:nth-child(odd) span { top: 28px; }
.ladder u:nth-child(odd)::after { content: ''; position: absolute; left: 0; top: 100%; height: 13px; border-left: 1px dotted var(--mu); }
.ladder u span { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--mu); white-space: nowrap; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.stat { background: var(--sf2); border: 1px solid var(--bd); border-radius: 8px; padding: 4px 9px; min-width: 0; }
.stat small { display: block; color: var(--mu); font-size: 11.5px; white-space: nowrap; }
.stat b { font-size: 15px; font-variant-numeric: tabular-nums; }
.stat.w b { color: var(--warn); }
.bars { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 4px 22px; }
.br { display: grid; grid-template-columns: 5.6em 1fr 4.6em; gap: 8px; align-items: center; font-size: 13px; }
.br span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 8px; background: var(--sf2); border-radius: 4px; overflow: hidden; border: 1px solid var(--bd); }
.bar b { display: block; height: 100%; background: var(--base); transition: width .25s; }
.bar.bn b { background: var(--bonus); }
.br em { font-style: normal; text-align: right; color: var(--mu); font-variant-numeric: tabular-nums; }
.chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid color-mix(in srgb, var(--c) 55%, var(--bd)); border-radius: 999px; padding: 3px 12px; background: var(--sf); color: var(--mu); font-size: 13px; }
.chip.ok { background: color-mix(in srgb, var(--c) 14%, var(--sf)); color: var(--tx); }
.chip.cur { background: color-mix(in srgb, var(--c) 24%, var(--sf)); color: var(--tx); font-weight: 700; border: 2px solid var(--c); padding: 2px 11px; }
.chip em { font-style: normal; margin-left: 8px; padding: 0 8px; border-radius: 999px; background: var(--c); color: #fff; font-size: 12px; }
.chip small { margin-left: 5px; }
.chips .hint { color: var(--mu); font-size: 12.5px; margin-left: auto; }

/* ---------- 工具列 ---------- */
#tb { display: flex; gap: 6px; padding: 7px 16px; border-top: 1px solid var(--bd); background: var(--bg); overflow-x: auto; align-items: center; }
#tb .bt { font-size: 13px; padding: 4px 10px; flex: 0 0 auto; }
.mini { display: none; margin-left: auto; font-weight: 600; font-size: 13px; white-space: nowrap; padding-left: 8px; }
.mini .tag { color: var(--gc, var(--mu)); }
.folded .mini { display: inline; }

/* ---------- 內容 ---------- */
main { max-width: 1000px; margin: 0 auto; padding: 14px 16px 30px; display: grid; gap: 10px; }
.card { background: var(--sf); border: 1px solid var(--bd); border-radius: 10px; box-shadow: 0 1px 2px rgba(20, 32, 51, .06); overflow: hidden; }
.card:has(.cb) > .ch { background: var(--sf2); border-bottom: 1px solid var(--bd); }
.cb { padding-top: 4px; }
.ch { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 9px 12px; }
.ib { border: 0; background: none; font-weight: 700; font-size: 17px; padding: 2px 0; text-align: left; display: flex; align-items: center; gap: 6px; }
.ib .ar { color: var(--mu); width: 1.1em; }
.tagb { font-size: 12px; font-weight: 600; padding: 0 8px; border-radius: 999px; background: color-mix(in srgb, var(--bonus) 16%, var(--sf)); color: var(--bonus); border: 1px solid color-mix(in srgb, var(--bonus) 50%, var(--bd)); }
.isc { font-variant-numeric: tabular-nums; font-weight: 600; }
.imeta { color: var(--mu); font-size: 12.5px; }
.ch .grow { flex: 1 1 120px; min-width: 80px; }
.basic { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.basic input { width: 16px; height: 16px; accent-color: var(--ac); }
.basic.na { color: var(--mu); }
.cb { padding: 0 12px 10px; }
.gh { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 18px; margin-bottom: 4px; padding: 8px 12px; background: var(--hd); color: var(--hdt); border-radius: 8px; font-size: 15px; letter-spacing: .02em; }
.gh:first-child { margin-top: 6px; }
.gh b { font-weight: 700; }
.gh span { color: var(--hdt); opacity: .9; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.it { display: grid; grid-template-columns: 3.6em minmax(0, 1fr) auto; gap: 4px 10px; padding: 9px 4px; border-bottom: 1px solid var(--bd); align-items: start; }
.it:last-child { border-bottom: 0; }
.it.napp { opacity: .75; }
.id { color: var(--mu); font-size: 13px; font-variant-numeric: tabular-nums; padding-top: 2px; }
.txb { border: 0; background: none; text-align: left; padding: 0; font-size: 14px; width: 100%; }
.txb .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.txb.op .t { display: block; }
.st { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.badge { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--bd); color: var(--mu); background: var(--sf2); white-space: nowrap; }
.badge.ok { color: var(--ok); background: var(--oks); border-color: color-mix(in srgb, var(--ok) 40%, var(--bd)); }
.badge.zero { color: var(--bad); background: var(--bads); border-color: color-mix(in srgb, var(--bad) 40%, var(--bd)); }
.badge.pend { color: var(--warn); background: var(--warns); border-color: color-mix(in srgb, var(--warn) 45%, var(--bd)); }
.badge.cap { color: var(--ac); background: var(--acs); }
.det { margin-top: 6px; padding: 8px 10px; border-left: 3px solid var(--bd); background: var(--sf2); border-radius: 0 6px 6px 0; font-size: 13px; color: var(--mu); }
.det p { margin: 0 0 6px; }
.det p:last-child { margin: 0; }
.det b { color: var(--tx); }
.det ul { margin: 4px 0 6px 1.2em; padding: 0; }
.det .wn { color: var(--warn); }
.pl { display: flex; flex-wrap: wrap; gap: 6px 10px; justify-content: flex-end; max-width: 360px; }
.pg { display: inline-flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.p { min-width: 2.9em; padding: 3px 9px; border: 1px solid var(--bd); border-radius: 999px; background: var(--sf); font-size: 13px; font-variant-numeric: tabular-nums; }
@media (hover: hover) { .p:hover { background: var(--sf2); } }
.p[aria-pressed="true"] { background: var(--ac); border-color: var(--ac); color: var(--ont); font-weight: 600; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--bd); border-radius: 999px; overflow: hidden; background: var(--sf); }
.step button { border: 0; background: transparent; width: 28px; height: 26px; font-size: 16px; line-height: 1; }
.step button:disabled { opacity: .35; cursor: default; }
.step output { min-width: 3.4em; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; padding: 0 4px; }
.step.on { border-color: var(--ac); }
.na-box { margin: 8px 0 0; font-size: 13px; color: var(--mu); }
.na-box summary { cursor: pointer; }
.na-box li { margin: 2px 0; }
.rst { border: 0; background: none; color: var(--mu); font-size: 12px; text-decoration: underline; padding: 0 2px; }

/* ---------- 建議面板 ---------- */
.advice { background: var(--sf); border: 1px solid var(--ac); border-radius: 8px; padding: 12px 14px; }
.advice h2 { font-size: 16px; margin: 0 0 6px; }
.advice .sum { font-size: 14px; margin: 0 0 8px; }
.advice .note { font-size: 12.5px; color: var(--mu); margin: 6px 0 10px; }
.advice ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.advice li { border: 1px solid var(--bd); border-radius: 6px; padding: 8px 10px; background: var(--sf2); }
.advice li .hd { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.advice li .gain { font-weight: 700; color: var(--ok); }
.advice li p { margin: 4px 0 0; font-size: 13px; color: var(--mu); }
.advice li .cv { color: var(--warn); }
.advice .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

/* ---------- 對話框與提示 ---------- */
dialog { border: 1px solid var(--bd); border-radius: 10px; background: var(--sf); color: var(--tx); padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 32px); }
dialog::backdrop { background: rgba(10, 18, 30, .5); }
.dh { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--bd); }
.dh h2 { margin: 0; font-size: 17px; }
.db { padding: 14px 16px; overflow: auto; max-height: calc(100vh - 170px); font-size: 14px; }
.db p { margin: 0 0 10px; }
.db ul { margin: 0 0 10px; padding-left: 1.3em; }
.db textarea { width: 100%; min-height: 150px; border: 1px solid var(--bd); border-radius: 6px; background: var(--sf2); padding: 8px; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
.db input[type="text"] { width: 100%; border: 1px solid var(--bd); border-radius: 6px; background: var(--sf); padding: 6px 9px; }
.df { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--bd); }
.plist { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
.plist li { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; border: 1px solid var(--bd); border-radius: 6px; padding: 6px 9px; }
.plist li.cur { border-color: var(--ac); background: var(--acs); }
.plist .nm { flex: 1 1 140px; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.plist small { color: var(--mu); }
.warnb { background: var(--warns); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--bd)); border-radius: 6px; padding: 8px 10px; margin: 0 0 10px; color: var(--tx); font-size: 13px; }
.errb { background: var(--bads); border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--bd)); border-radius: 6px; padding: 8px 10px; margin: 0 0 10px; font-size: 13px; }
#ts { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--tx); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 60; max-width: 92vw; display: none; align-items: center; gap: 12px; }
#ts.show { display: flex; }
#ts button { border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 6px; padding: 1px 10px; }
footer { max-width: 1000px; margin: 0 auto; padding: 0 16px 28px; color: var(--mu); font-size: 12.5px; }

/* ---------- 列印版 ---------- */
#report { display: none; }
.rp h1 { font-size: 20px; margin: 0 0 4px; }
.rp h2 { font-size: 15px; margin: 14px 0 6px; border-bottom: 1px solid #999; padding-bottom: 2px; }
.rp table { width: 100%; border-collapse: collapse; font-size: 12px; }
.rp th, .rp td { border: 1px solid #aaa; padding: 3px 6px; text-align: left; vertical-align: top; }
.rp td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rp .meta { font-size: 12px; margin: 0 0 8px; }
.rp .dis { font-size: 11px; margin-top: 14px; }
@media print {
  body { background: #fff; color: #000; font-size: 12px; }
  .stick, main, footer, dialog, #ts { display: none !important; }
  #report { display: block; }
  :root { color-scheme: light; }
}

/* ---------- 窄螢幕 ---------- */
@media (max-width: 760px) {
  #dash { grid-template-columns: 104px minmax(0, 1fr); }
  .ring svg { width: 104px; height: 104px; }
  .ring .big { font-size: 28px; }
  .stats { grid-column: 1 / -1; }
  .pill { font-size: 17px; padding: 3px 12px; }
  .it { grid-template-columns: 3em minmax(0, 1fr); }
  .pl { grid-column: 2; justify-content: flex-start; max-width: none; }
  .pg { justify-content: flex-start; }
  .mini { display: inline; }
  .top h1 { font-size: 15px; }
  .proj { max-width: 130px; }
  .chips .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.ver { font-size: 13px; font-weight: 600; color: var(--ac); border: 1px solid var(--ac); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }

/* 專家建議組合清單 */
.advice h3 small { font-weight: 400; color: var(--mu); }
.pset { list-style: none; margin: 4px 0 12px; padding: 0; }
.pset li { display: grid; grid-template-columns: 56px 1fr auto auto; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--bd); font-size: 14px; }
.pset .num { font-variant-numeric: tabular-nums; }
.pset .gain { font-weight: 600; white-space: nowrap; }
@media (max-width: 760px) { .pset li { grid-template-columns: 48px 1fr auto; } .pset .badge { grid-column: 2 / 4; justify-self: start; } }

/* 專家建議取分說明 */
.whyl { margin: 3px 0 0; font-size: 13px; line-height: 1.5; color: var(--bad); }
.whyl b { font-weight: 700; }
.det .why { color: var(--bad); }

/* 基本規定列（不計分）與計分項目的視覺區分：
 * 基本規定＝琥珀色底＋粗左邊條＋實心標籤（門檻，必須符合）；計分項目＝白底＋藍色細左邊條（拿分）。 */
.it { border-left: 4px solid var(--ac); padding-left: 10px; }
.it.bs { background: var(--warns); border-left-color: var(--warn); border-bottom-color: color-mix(in srgb, var(--warn) 25%, transparent); }
.it.bs .id { color: var(--warn); font-weight: 700; }
.badge.bsb { color: var(--ont); background: var(--warn); border-color: var(--warn); font-weight: 700; }
.it.bs .basic { font-size: 14px; font-weight: 700; color: var(--warn); padding: 4px 10px; border: 1.5px solid var(--warn); border-radius: 999px; background: var(--sf); }
.it.bs .basic input { accent-color: var(--warn); }
.gh + .it.bs { margin-top: 2px; }
.it.bs + .it:not(.bs) { margin-top: 6px; }
/* 版本註記與容積獎勵 */
.vnote { max-width: 1000px; margin: 12px auto 0; padding: 0 16px; font-size: 13px; color: var(--tx); }
.vnote p { margin: 0 0 6px; line-height: 1.6; }
.vnote .mu { color: var(--mu); }
.incd { background: var(--sf); border: 1px solid var(--bd); border-radius: 10px; padding: 8px 12px; }
.incd summary { cursor: pointer; font-weight: 600; }
.incd table { border-collapse: collapse; margin: 8px 0; width: 100%; }
.incd th, .incd td { border: 1px solid var(--bd); padding: 4px 8px; text-align: center; font-size: 13px; }
.incd th { background: var(--sf2); }
.incd ul { margin: 6px 0 6px 18px; padding: 0; }
.chip .inc { display: block; font-size: 11px; opacity: .85; }

/* 版本說明：滑鼠移上才顯示，不佔版面 */
.vwrap { position: relative; display: inline-block; }
button.ver { background: transparent; cursor: help; font-family: inherit; }
.vtip { display: none; position: absolute; top: 100%; left: 0; z-index: 60; width: min(360px, 86vw); padding-top: 8px; }

.ct th small { display: block; font-weight: 400; opacity: .85; }
.ct .n { text-align: center; font-variant-numeric: tabular-nums; }

<script>
/* 計分引擎：全部為純函式，不讀取畫面、不依賴全域狀態。
 * 輸入：rules（js/data/rulesXXXX.js）、state = { cat, answers, basics }
 * answers[itemId] = 每個控制項一個值：check → 0/1；tier → 選項索引（-1 = 未選）；count → 整數；judged → 分數
 * 總分永遠由 answers 重新計算，不累加畫面上的數字。
 */
(function (g) {
  'use strict';
  const SBS = (g.SBS = g.SBS || {});
  const E = {};

  const pv = (v, c) => (Array.isArray(v) ? v[c] : v);
  const round = (x) => Math.round(x * 1000) / 1000; // 內部保留 3 位小數，避免 0.5 分累加的浮點誤差；顯示格式另訂
  const isNum = (x) => typeof x === 'number' && isFinite(x);
  E.pv = pv;
  E.round = round;

  /** 建築類別索引：無類別的版本（2024）固定為 0 */
  E.catIndex = (rules, cat) => (rules.categories ? Math.max(0, cat | 0) : 0);
  E.stateKey = (rules, cat) => (rules.categories ? rules.version + ':' + E.catIndex(rules, cat) : rules.version);

  // ---------------------------------------------------------------- 控制項
  E.controlMax = (ctrl, c) => {
    switch (ctrl.type) {
      case 'check': return pv(ctrl.points, c);
      case 'tier': return Math.max.apply(null, ctrl.options.map((o) => o.points));
      case 'count': return ctrl.unit * ctrl.max;
      case 'judged': return ctrl.max;
      case 'sys': return Math.max.apply(null, ctrl.tiers.map((t) => t[1]));
      default: throw new Error('未知的控制項類型：' + ctrl.type);
    }
  };
  E.controlDefault = (ctrl) => (ctrl.type === 'tier' ? -1 : 0);
  /** 勾選系統（位元遮罩）：依勾選數落在哪個門檻換算分數 */
  E.popcount = (n) => { let c = 0; for (let x = n; x > 0; x = Math.floor(x / 2)) c += x % 2; return c; };
  E.sysCount = (ctrl, val) => (isNum(val) && val > 0 ? E.popcount(val % Math.pow(2, ctrl.systems.length)) : 0);
  E.controlScore = (ctrl, val, c) => {
    if (val === undefined || val === null) return 0;
    switch (ctrl.type) {
      case 'check': return val ? pv(ctrl.points, c) : 0;
      case 'tier': return val >= 0 && val < ctrl.options.length ? ctrl.options[val].points : 0;
      case 'count': return isNum(val) ? Math.min(Math.max(val, 0), ctrl.max) * ctrl.unit : 0;
      case 'judged': return isNum(val) ? Math.min(Math.max(val, 0), ctrl.max) : 0;
      case 'sys': { const n = E.sysCount(ctrl, val); let pts = 0; ctrl.tiers.forEach((t) => { if (n >= t[0]) pts = Math.max(pts, t[1]); }); return pts; }
      default: return 0;
    }
  };
  /** 將控制項設為「最高分情境」 */
  E.controlTop = (ctrl) => {
    switch (ctrl.type) {
      case 'check': return 1;
      case 'tier': {
        let best = 0;
        ctrl.options.forEach((o, i) => { if (o.points > ctrl.options[best].points) best = i; });
        return best;
      }
      case 'count': case 'judged': return ctrl.max;
      case 'sys': return Math.pow(2, ctrl.systems.length) - 1;
      default: return 0;
    }
  };
  E.controlValid = (ctrl, v) => {
    switch (ctrl.type) {
      case 'check': return v === 0 || v === 1;
      case 'tier': return Number.isInteger(v) && v >= -1 && v < ctrl.options.length;
      case 'count': case 'judged': return Number.isInteger(v) && v >= 0 && v <= ctrl.max;
      case 'sys': return Number.isInteger(v) && v >= 0 && v < Math.pow(2, ctrl.systems.length);
      default: return false;
    }
  };

  // ---------------------------------------------------------------- 項目
  E.itemMax = (item, c) => pv(item.max, c);
  E.itemNA = (item, c) => {

    return { na: false, reason: '' };
  };
  E.blankAnswer = (item) => item.controls.map(E.controlDefault);
  E.itemRaw = (item, c, ans) => round(item.controls.reduce((a, ctrl, j) => a + E.controlScore(ctrl, ans ? ans[j] : undefined, c), 0));
  E.itemScore = (item, c, ans) => Math.min(E.itemMax(item, c), E.itemRaw(item, c, ans));
  /** 'na' | 'unassessed' | 'scored' | 'zero'（操作過但得 0 分 = 尚未達成） */
  E.itemState = (item, c, ans) => {
    if (E.itemNA(item, c).na) return 'na';
    if (!ans) return 'unassessed';
    return E.itemScore(item, c, ans) > 0 ? 'scored' : 'zero';

  E.itemTop = (item) => item.controls.map(E.controlTop);

  // ---------------------------------------------------------------- 等級
  /**
   * 等級判定。
   * - 基本規定須全數符合才有任何等級。
   * - basicOnly 的等級（2016 合格級）只看基本規定；其餘等級看分數。
   */
  E.gradeOf = (rules, total, basicsOk) => {
    const levels = rules.grades.map((gr, i) => ({
      index: i, name: gr.name, min: gr.min, basicOnly: !!gr.basicOnly,
      reachedByScore: gr.basicOnly ? true : total >= gr.min,
    }));
    let byScore = -1; // 只看分數、不看基本規定時可達的最高等級
    levels.forEach((l) => { if (l.reachedByScore) byScore = l.index; });
    const level = basicsOk ? byScore : -1;
    levels.forEach((l) => { l.achieved = basicsOk && l.reachedByScore; l.current = l.index === level; });
    const nxt = levels.find((l) => !l.basicOnly && total < l.min);
    return {
      basicsOk, byScore, level,
      name: level >= 0 ? levels[level].name : null,
      scoreName: byScore >= 0 ? levels[byScore].name : null,
      next: nxt ? { name: nxt.name, min: nxt.min, gap: round(nxt.min - total) } : null,
      levels,
    };
  };

  // ---------------------------------------------------------------- 基本規定
  /** 指標在該類別適用的基本規定清單。有 ind.basics 時逐條列出；否則（舊資料格式）整個指標視為一條。 */
  E.basicRules = (ind, c) => {
    if (!ind.hasBasic || (ind.basicNA || []).includes(c)) return [];
    return ind.basics && ind.basics.length ? ind.basics : [{ id: ind.id, text: '', legacy: true }];
  };
  /** 舊版儲存的「指標層級」勾選（basics['1']=true）展開為逐條勾選；不影響原物件 */
  E.normalizeBasics = (rules, basics) => {
    const out = Object.assign({}, basics || {});
    rules.indicators.forEach((ind) => {
      if (ind.basics && ind.basics.length && out[ind.id] === true) { ind.basics.forEach((b) => { out[b.id] = true; }); }

  // ---------------------------------------------------------------- 全部計算
  E.compute = (rules, st) => {
    const c = E.catIndex(rules, st.cat);
    const answers = st.answers || {};
    const basics = E.normalizeBasics(rules, st.basics);
    const items = {};
    const inds = [];
    const counts = { items: 0, unassessed: 0, scored: 0, zero: 0, pending: 0, na: 0 };
    let total = 0, base = 0, bonus = 0, maxTotal = 0, baseMax = 0, bonusMax = 0, rawTotal = 0;
    const missing = [];
    let basicRequired = 0, basicDone = 0;

    rules.indicators.forEach((ind) => {
      const ir = { id: ind.id, name: ind.name, bonus: !!ind.bonus, groups: [], score: 0, raw: 0, max: 0, unassessed: 0, pending: 0, scored: 0, na: 0, items: 0 };
      ind.groups.forEach((grp) => {
        const cap = pv(grp.cap, c);
        let sum = 0, sumMax = 0;
        const ids = [];
        grp.items.forEach((it) => {
          ids.push(it.id);
          const na = E.itemNA(it, c);
          if (na.na) { items[it.id] = { id: it.id, state: 'na', reason: na.reason, score: 0, max: 0, raw: 0, pending: false }; counts.na++; ir.na++; return; }
          const max = E.itemMax(it, c);
          const ans = answers[it.id];
          const raw = E.itemRaw(it, c, ans);
          const score = Math.min(max, raw);
          const state = E.itemState(it, c, ans);
          const pending = it.status === 'review';
          items[it.id] = { id: it.id, state, score, max, raw, pending, capped: raw > max };
          sum += score; sumMax += max;

        });

        const gr = { id: grp.id, name: grp.name, cap, max: gMax, raw: round(sum), score: gScore, capped: sum > cap, na: cap === 0 || ids.every((i) => items[i].state === 'na'), itemIds: ids };

    return {
      cat: c, indicators: inds, items, counts,
      total, base, bonus, rawTotal, maxTotal, baseMax, bonusMax,
      progress: maxTotal > 0 ? Math.min(1, total / maxTotal) : 0,
      basics: { required: basicRequired, done: basicDone, missing, ok: basicsOk },
      grade: E.gradeOf(rules, total, basicsOk),
    };
  };

  // ---------------------------------------------------------------- 情境填寫
  /** 回傳新的 answers：所有適用項目填成最高分情境。includeBonus=false 時略過加分指標。 */
  E.fillAnswers = (rules, cat, opts) => {
    const c = E.catIndex(rules, cat);
    const out = {};
    rules.indicators.forEach((ind) => {
      if (ind.bonus && !(opts && opts.includeBonus)) return;
      ind.groups.forEach((grp) => grp.items.forEach((it) => { if (!E.itemNA(it, c).na) out[it.id] = E.itemTop(it); }));
    });
    return out;
  };
  E.basicsAll = (rules, cat) => {
    const c = E.catIndex(rules, cat);
    const out = {};
    rules.indicators.forEach((ind) => { E.basicRules(ind, c).forEach((b) => { out[b.id] = true; }); });
    return out;
  };

  /** 逐一尋找項目 */
  E.findItem = (rules, id) => {
    for (const ind of rules.indicators) for (const grp of ind.groups) for (const it of grp.items) if (it.id === id) return { ind, grp, it };
    return null;
  };
  E.allItems = (rules) => rules.indicators.flatMap((ind) => ind.groups.flatMap((grp) => grp.items.map((it) => ({ ind, grp, it }))));

  /** 回傳新的 answers（不修改輸入）：把 item 的第 j 個控制項設為 value */
  E.setControl = (rules, answers, itemId, j, value) => {
    const f = E.findItem(rules, itemId);
    if (!f) throw new Error('找不到項目：' + itemId);
    const cur = answers[itemId] ? answers[itemId].slice() : E.blankAnswer(f.it);
    cur[j] = value;
    return Object.assign({}, answers, { [itemId]: cur });
  };
  E.resetItem = (answers, itemId) => { const o = Object.assign({}, answers); delete o[itemId]; return o; };

  // ---------------------------------------------------------------- 驗證（匯入用）
  E.validateAnswers = (rules, cat, answers) => {
    const c = E.catIndex(rules, cat);
    const errors = [];
    const cleaned = {};
    if (!answers || typeof answers !== 'object' || Array.isArray(answers)) return { ok: false, errors: ['answers 不是物件'], cleaned };
    Object.keys(answers).forEach((id) => {
      const f = E.findItem(rules, id);
      let a = answers[id];
      if (!f) { errors.push('未知項目：' + id); return; }
      if (E.itemNA(f.it, c).na) { errors.push('項目 ' + id + ' 於此類別不適用，已忽略'); return; }
      if (!Array.isArray(a) || a.length !== f.it.controls.length) { errors.push('項目 ' + id + ' 的作答格式不符'); return; }
      if (!a.every((v, j) => E.controlValid(f.it.controls[j], v))) { errors.push('項目 ' + id + ' 含有超出範圍的值'); return; }
      cleaned[id] = a.slice();
    });
    return { ok: errors.length === 0, errors, cleaned };
  };
  E.validateBasics = (rules, cat, basics) => {
    const c = E.catIndex(rules, cat);
    const errors = [];
    const cleaned = {};
    if (!basics || typeof basics !== 'object' || Array.isArray(basics)) return { ok: false, errors: ['basics 不是物件'], cleaned };
    Object.keys(basics).forEach((id) => {
      if (typeof basics[id] !== 'boolean') { errors.push('基本規定 ' + id + ' 的值須為布林'); return; }
      // 舊格式：以指標編號勾選 → 展開成該指標的所有基本規定
      const ind = rules.indicators.find((i) => i.id === id);
      if (ind && ind.basics && ind.basics.length) { if (basics[id] && E.basicRules(ind, c).length) E.basicRules(ind, c).forEach((b) => { cleaned[b.id] = true; }); return; }
      const owner = rules.indicators.find((i) => E.basicRules(i, c).some((b) => b.id === id));
      if (!owner) { errors.push('基本規定 ' + id + ' 不存在或不適用，已忽略'); return; }
      if (basics[id]) cleaned[id] = true;
    });
    return { ok: errors.length === 0, errors, cleaned };
  };

  /** 資料結構自我檢查（供測試與載入時使用） */
  E.validateRules = (rules) => {
    const errs = [];
    const seen = new Set();
    const ncat = rules.categories ? rules.categories.length : 1;
    rules.indicators.forEach((ind) => ind.groups.forEach((grp) => {
      for (let c = 0; c < ncat; c++) {
        const cap = pv(grp.cap, c);
        const sumMax = grp.items.reduce((a, it) => a + pv(it.max, c), 0);
        if (sumMax < cap) errs.push(`群組 ${grp.id}（類別 ${c}）：子項合計 ${sumMax} 小於上限 ${cap}`);
      }
      grp.items.forEach((it) => {
        if (seen.has(it.id)) errs.push('項目編號重複：' + it.id);
        seen.add(it.id);
        if (!it.controls || !it.controls.length) errs.push('項目 ' + it.id + ' 沒有控制項');
        for (let c = 0; c < ncat; c++) {
          const max = pv(it.max, c);
          if (max === 0 && !(it.na && it.na[c])) errs.push(`項目 ${it.id}（類別 ${c}）為 0 分但沒有不適用原因`);
          if (max > 0) {
            const reach = it.controls.reduce((a, ctrl) => a + E.controlMax(ctrl, c), 0);
            if (reach < max) errs.push(`項目 ${it.id}（類別 ${c}）：控制項最高 ${reach} 小於上限 ${max}`);
          }
        }
      });
    }));
    return errs;
  };

  SBS.engine = E;
  if (typeof module !== 'undefined') module.exports = E;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* 規則式取分建議：只產生建議，不修改任何作答。
 * 重要：手冊沒有提供各項目的「施作難易度」，因此排序只依「可實際增加的分數」，
 * 並明確標示難易度無法判定；需評定小組認定的項目排在後面。
 */
(function (g) {
  'use strict';
  const SBS = (g.SBS = g.SBS || {});
  const E = g.SBS.engine || require('./engine.js');
  const A = {};

  const isJudged = (it) => it.controls.some((c) => c.type === 'judged');

  /** 項目目前得分、最高分，以及若此項取滿分整體總分的實際增加量（含群組／項目上限） */
  function candidates(rules, st, view) {
    const c = view.cat;
    const out = [];
    E.allItems(rules).forEach(({ ind, grp, it }) => {
      const info = view.items[it.id];
      if (!info || info.state === 'na' || info.score >= info.max) return;
      const trial = Object.assign({}, st.answers, { [it.id]: E.itemTop(it) });
      const v2 = E.compute(rules, { cat: st.cat, answers: trial, basics: st.basics });
      const gain = E.round(v2.total - view.total);
      out.push({ it, ind, grp, info, gain, itemGain: E.round(info.max - info.score) });
    });
    return out;
  }

  function describe(rules, cand, view) {
    const { it, ind, grp, info } = cand;
    const steps = it.controls.map((ctrl, j) => {
      switch (ctrl.type) {
        case 'check': return ctrl.label ? ctrl.label : '符合本項要求';
        case 'tier': { const top = ctrl.options[E.controlTop(ctrl)]; return '最高階：' + top.label; }
        case 'sys': return ctrl.label + '：支援 ' + ctrl.tiers[ctrl.tiers.length - 1][0] + ' 項以上系統';
        case 'count': return ctrl.label;
        case 'judged': return ctrl.label;
        default: return '';
      }
    });
    const gr = view.indicators.find((i) => i.id === ind.id);
    const reasons = [];
    reasons.push('可增加 ' + cand.gain + ' 分（本項目前 ' + info.score + ' / ' + info.max + '）');
    if (cand.gain < cand.itemGain) reasons.push('受群組／指標上限影響，實際只能增加 ' + cand.gain + ' 分');
    reasons.push(ind.name + '指標目前 ' + gr.score + ' / ' + gr.max);
    const caveats = [];
    if (isJudged(it)) caveats.push('分數由評定小組認定，無法保證取得');
    if (it.status === 'review') caveats.push(it.note || '本項規則待與手冊原文確認');
    (it.hints || []).forEach((h) => caveats.push(h));
    return {
      id: it.id, text: it.text, indicator: ind.name, indicatorId: ind.id, group: grp.id + ' ' + grp.name,
      current: info.score, max: info.max, gain: cand.gain, itemGain: cand.itemGain,
      steps, reason: reasons.join('；'), caveats, ref: it.ref, judged: isJudged(it), pending: it.status === 'review',
    };
  }

  // 需評定小組認定的項目一律排在後面（取分不確定），其餘依可增加分數、注意事項多寡、編號排序
const rank = (a, b) => (a.judged - b.judged) || (b.gain - a.gain) || (a.caveats.length - b.caveats.length) || (a.id < b.id ? -1 : 1);

  /**
   * @param {object} opts { target: 等級索引（預設為下一個等級）}
   */
  A.suggest = (rules, st, opts) => {
    const view = E.compute(rules, st);
    const grade = view.grade;
    let target = null;
    if (opts && Number.isInteger(opts.target)) {
      const l = grade.levels[opts.target];
      if (l && !l.basicOnly) target = { name: l.name, min: l.min };
    } else if (grade.next) target = { name: grade.next.name, min: grade.next.min };
    const gap = target ? Math.max(0, E.round(target.min - view.total)) : 0;

    const cands = candidates(rules, st, view).map((cd) => describe(rules, cd, view)).sort(rank);
    const potential = E.round(rules.maxTotal ? view.maxTotal - view.total : 0);

    // 以「每步取實際增加量最大者」逐步模擬，找出可補足缺口的最少項目組合（不寫入作答）
    const plan = [];
    let planAnswers = Object.assign({}, st.answers);
    let planTotal = view.total;
    if (target) {
      const remaining = cands.map((x) => x.id);
      let guard = 0;
      while (planTotal < target.min && guard++ < 200) {
        let best = null;
        for (const id of remaining) {
          const f = E.findItem(rules, id);
          const trial = Object.assign({}, planAnswers, { [id]: E.itemTop(f.it) });
          const t2 = E.compute(rules, { cat: st.cat, answers: trial, basics: st.basics }).total;
          const gain = E.round(t2 - planTotal);
          const meta = cands.find((x) => x.id === id);
          if (gain <= 0) continue;
          const better = !best || (meta.judged - best.meta.judged) < 0 || (meta.judged === best.meta.judged && gain > best.gain);
          if (better) best = { id, gain, meta, trial, t2 };
        }
        if (!best) break;
        plan.push(Object.assign({}, best.meta, { planGain: best.gain }));
        planAnswers = best.trial; planTotal = best.t2;
        remaining.splice(remaining.indexOf(best.id), 1);
      }
    }
    return {
      total: view.total, maxTotal: view.maxTotal, target, gap,
      basics: view.basics, level: grade.name, scoreName: grade.scoreName,
      reachable: !target || planTotal >= target.min, planTotal,
      potential, items: cands, plan,
      note: '手冊未提供各項目的施作難易度，本建議只依「可增加的分數」排序，並將需評定小組認定的項目排在後面；實際取分難度需由專業人員判斷。',
    };
  };

  /** 套用單一項目的最高分情境；回傳新的 answers（呼叫端決定是否採用） */
  A.applyItem = (rules, answers, itemId) => {
    const f = E.findItem(rules, itemId);
    if (!f) throw new Error('找不到項目：' + itemId);
    return Object.assign({}, answers, { [itemId]: E.itemTop(f.it) });
  };
  A.applyMany = (rules, answers, ids) => ids.reduce((a, id) => A.applyItem(rules, a, id), answers);

  SBS.advisor = A;
  if (typeof module !== 'undefined') module.exports = A;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* 狀態儲存層：多專案、自動儲存（localStorage）、匯出入 JSON。
 * storage 參數可注入（測試時使用假的 storage）。
 * 注意：localStorage 只存在這個瀏覽器，不會自動備份或同步到其他裝置。
 */
(function (g) {
  'use strict';
  const SBS = (g.SBS = g.SBS || {});
  const E = g.SBS.engine || require('./engine.js');
  const S = {};

  S.KEY = 'sbs.v2';
  S.SCHEMA = 2;
  S.FORMAT = 'smart-building-scoring';

  const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  S.newProject = (name, version) => ({
    id: uid(), name: (name || '').trim() || '未命名專案', created: Date.now(), updated: Date.now(),
    version: version || '2024', cat: 0, data: {},
  });

  S.emptyDb = () => {
    const p = S.newProject('我的第一個專案');
    return { schema: S.SCHEMA, active: p.id, projects: { [p.id]: p }, theme: '' };
  };

  /** 取得專案在「版本＋類別」下的資料（不存在則回傳空資料，不寫入） */
  S.slice = (rules, project, cat) => {
    const k = E.stateKey(rules, cat);
    return (project.data && project.data[k]) || { answers: {}, basics: {}, evidence: {} };
  };
  S.withSlice = (rules, project, cat, slice) => {
    const k = E.stateKey(rules, cat);
    return Object.assign({}, project, { updated: Date.now(), data: Object.assign({}, project.data, { [k]: slice }) });
  };

  // ---------------------------------------------------------------- 讀寫
  /** 1.1.2 曾短暫改為勾選系統（兩個位元遮罩），已還原為單選階梯：把遮罩依項數換回階梯索引 */
  S.migrate = (db) => {
    const pc = (n) => { let c = 0; for (let x = n; x > 0; x = Math.floor(x / 2)) c += x % 2; return c; };
    Object.keys(db.projects || {}).forEach((pid) => {
      const data = (db.projects[pid] || {}).data || {};
      Object.keys(data).forEach((key) => {
        const a = data[key] && data[key].answers && data[key].answers['1.1.2'];
        if (key.indexOf('2024') === 0 && Array.isArray(a) && a.length === 2) {
          const f = pc(a[0] || 0), c = pc(a[1] || 0);
          const fi = f >= 12 ? 3 : f >= 9 ? 2 : f >= 6 ? 1 : f >= 3 ? 0 : -1, ci = c >= 6 ? 5 : c >= 3 ? 4 : -1;
          const fp = fi >= 0 ? [2, 4, 6, 8][fi] : 0, cp = ci >= 0 ? [2, 4][ci - 4] : 0;
          if (fp === 0 && cp === 0) delete data[key].answers['1.1.2'];
          else data[key].answers['1.1.2'] = [fp >= cp ? fi : ci];
        }
      });
    });
  };
  S.load = (storage) => {
    try {
      const raw = storage.getItem(S.KEY);
      if (!raw) return { db: S.emptyDb(), error: null, fresh: true };
      const db = JSON.parse(raw);
      if (!db || db.schema !== S.SCHEMA || !db.projects || !db.active || !db.projects[db.active]) throw new Error('儲存格式不符');
      S.migrate(db);
      return { db, error: null, fresh: false };
    } catch (e) {
      return { db: S.emptyDb(), error: '讀取已儲存的資料失敗（' + e.message + '），已建立新的專案。', fresh: true };
    }
  };
  S.save = (storage, db) => {
    try {
      storage.setItem(S.KEY, JSON.stringify(db));
      return { ok: true, at: Date.now() };
    } catch (e) {
      return { ok: false, error: e && e.name === 'QuotaExceededError' ? '瀏覽器儲存空間不足' : '瀏覽器無法儲存（' + (e && e.message) + '）' };
    }
  };

  // ---------------------------------------------------------------- 匯出入
  S.exportProject = (project) => JSON.stringify({ format: S.FORMAT, schema: S.SCHEMA, exportedAt: new Date().toISOString(), project }, null, 1);

  /**
   * 驗證並匯入。回傳 { ok, project, errors, warnings }；有任何致命錯誤時不回傳 project，呼叫端不得改動目前資料。
   * rulesMap：{ '2016': rules, '2024': rules }
   */
  S.parseImport = (text, rulesMap) => {
    const errors = [], warnings = [];
    let obj;
    try { obj = JSON.parse(text); } catch (e) { return { ok: false, errors: ['檔案不是有效的 JSON'], warnings }; }
    if (!obj || obj.format !== S.FORMAT) return { ok: false, errors: ['這不是本工具匯出的檔案（format 欄位不符）'], warnings };
    if (obj.schema !== S.SCHEMA) return { ok: false, errors: ['不支援的資料版本：' + obj.schema + '（此工具為 ' + S.SCHEMA + '）'], warnings };
    const p = obj.project;
    if (!p || typeof p !== 'object') return { ok: false, errors: ['缺少 project 欄位'], warnings };
    if (typeof p.name !== 'string' || !p.name.trim()) errors.push('專案名稱缺漏');
    if (!rulesMap[p.version]) errors.push('未知的評估版本：' + p.version);
    if (errors.length) return { ok: false, errors, warnings };
    const rules = rulesMap[p.version];
    const out = S.newProject(p.name, p.version);
    out.created = Number.isFinite(p.created) ? p.created : Date.now();
    const ncat = rules.categories ? rules.categories.length : 1;
    out.cat = Number.isInteger(p.cat) && p.cat >= 0 && p.cat < ncat ? p.cat : 0;
    if (!p.data || typeof p.data !== 'object' || Array.isArray(p.data)) return { ok: false, errors: ['缺少 data 欄位'], warnings };
    Object.keys(p.data).forEach((key) => {
      const m = key.match(/^(\d{4})(?::(\d+))?$/);
      const r = m && rulesMap[m[1]];
      const cat = m && m[2] ? +m[2] : 0;
      if (!r || (r.categories ? !(m[2] && cat < r.categories.length) : !!m[2])) { warnings.push('略過無法辨識或未提供的資料：' + key); return; }
      const sl = p.data[key] || {};
      const va = E.validateAnswers(r, cat, sl.answers || {});
      const vb = E.validateBasics(r, cat, sl.basics || {});
      if (!va.ok || !vb.ok) warnings.push.apply(warnings, va.errors.concat(vb.errors).map((s) => key + '：' + s));
      const ev = {};
      Object.keys(sl.evidence || {}).forEach((id) => {
        const e = sl.evidence[id];
        if (e && typeof e === 'object') { const page = String(e.page || '').slice(0, 60), doc = String(e.doc || '').slice(0, 200); if (page || doc) ev[id] = { page, doc }; }
      });
      out.data[key] = { answers: va.cleaned, basics: vb.cleaned, evidence: ev };
    });
    if (errors.length) return { ok: false, errors, warnings };
    return { ok: true, project: out, errors: [], warnings };
  };

  SBS.store = S;
  if (typeof module !== 'undefined') module.exports = S;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

  let saveSt = persistent ? { ok: true, at: null } : { ok: false, error: '此瀏覽器無法儲存資料（重新整理後會消失）' };

    const r = S.save(storage, db);

  }

  /** 確認／輸入對話框，回傳 Promise：確認 → true（或輸入文字），取消 → null/false */
  function ask(o) {
    return new Promise((resolve) => {
      const foot = '<button class="bt" data-did="no">' + esc(o.cancel || '取消') + '</button><button class="bt ' + (o.danger ? 'dng' : 'pri') + '" data-did="ok">' + esc(o.ok || '確定') + '</button>';

      const d = openDlg('dlg2', o.title, body, foot);
      let done = false;
      const fin = (v) => { if (done) return; done = true; d.removeEventListener('click', onClick); d.removeEventListener('close', onClose); if (d.open) d.close(); resolve(v); };
      const onClick = (e) => {
        const b = e.target.closest('[data-did]'); if (!b) return;
        if (b.dataset.did === 'ok') fin(o.input ? ($('#askIn').value.trim() || null) : true); else fin(o.input ? null : false);

  }
  function groupHtml(grp, ind, view, st) {
    const gr = view.indicators.find((i) => i.id === ind.id).groups.find((x) => x.id === grp.id);
    const act = grp.items.filter((it) => view.items[it.id].state !== 'na');
    const nas = grp.items.filter((it) => view.items[it.id].state === 'na');
    let h = '<div class="gh"><b>' + grp.id + '　' + esc(grp.name) + '</b><span>' + (gr.na ? '本類別不適用' : F(gr.score) + ' / ' + F(gr.max) + (gr.capped ? '（已達群組上限）' : '')) + '</span></div>';
    const cmp = (a, b) => { const x = a.id.split('.').map(Number), y = b.id.split('.').map(Number); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; } return 0; };
    const rows = (ind.basics || []).filter((b) => b.id.indexOf(grp.id + '.') === 0).map((b) => ({ id: b.id, h: () => basicRowHtml(b, view) }))
      .concat(act.map((it) => ({ id: it.id, h: () => itemHtml(it, view, st) }))).sort(cmp);
    h += rows.map((r) => r.h()).join('');
    if (nas.length) h += '<details class="na-box"><summary>不適用項目（' + nas.length + '）</summary><ul>' + nas.map((it) => '<li><span class="num">' + it.id + '</span> ' + esc(it.text.length > 50 ? it.text.slice(0, 50) + '…' : it.text) + ' —— ' + esc(view.items[it.id].reason) + '</li>').join('') + '</ul></details>';
    return h;
  }

  function presetOf(R) { return (window.SBS_PRESET && window.SBS_PRESET[R.version]) || null; }
  function renderAdvice() {
    const host = $('#adviceHost');

    if (!P) { host.innerHTML = '<section class="advice" aria-label="取分建議"><div style="display:flex;justify-content:space-between"><h2>取分建議</h2><button class="bt sm" data-act="advClose">關閉</button></div>' + advancedHtml(R, st) + '</section>'; return; }
    const pv = E.compute(R, { cat: st.cat, answers: P.answers, basics: E.basicsAll(R, st.cat) });
    const cur = E.compute(R, st);
    const same = (id) => JSON.stringify(st.answers[id]) === JSON.stringify(P.answers[id]);
    const rows = R.indicators.map((ind) => {
      const its = ind.groups.flatMap((g) => g.items).filter((it) => P.answers[it.id]);

    }).join('');

  }

  // ---------------------------------------------------------------- 動作
  async function confirmIfUnsaved() {
    if (saveSt.ok) return true;
    return ask({ title: '資料尚未儲存', body: '<p>目前的資料<b>儲存失敗</b>（' + esc(saveSt.error) + '）。切換後仍留在這個頁面可繼續使用，但重新整理會遺失。' + (ADMIN ? '建議先「匯出」備份。' : '') + '仍要切換嗎？</p>', ok: '仍要切換' });
  }
  function applyAnswers(answers, basics, msg) {
    commit({ answers, basics }, true);
    toast(msg, { act: 'undo', label: '復原' });
  }
  function download(name, text) {
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { toast('此環境無法下載，請改用「複製」'); }
  }

  const actions = {
    async ver(b) {
      if (b.dataset.v === proj().version) return;
      if (!(await confirmIfUnsaved())) return;
      ui.open.clear(); ui.sg.clear(); ui.advice = null;
      setProject({ version: b.dataset.v, cat: 0 });
      toast('已切換到 ' + rules().label + '；各版本與類別的勾選分開保存，切回來會還原');
    },
    async cat(b) {
      if (+b.dataset.v === proj().cat) return;
      if (!(await confirmIfUnsaved())) return;
      ui.sg.clear(); setProject({ cat: +b.dataset.v });
    },
    theme() {
      const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      db.theme = dark ? 'light' : 'dark'; document.documentElement.dataset.theme = db.theme; scheduleSave(); render();
    },
    ind(b) { const id = b.dataset.id; ui.open.has(id) ? ui.open.delete(id) : ui.open.add(id); render(); },
    openAll() { rules().indicators.forEach((i) => ui.open.add(i.id)); render(); },
    closeAll() { ui.open.clear(); render(); },
    detail(b) { const id = b.dataset.id; ui.detail.has(id) ? ui.detail.delete(id) : ui.detail.add(id); render(); },
    ctl(b) {
      const R = rules(), st = stateNow(), id = b.dataset.id, j = +b.dataset.j, f = E.findItem(R, id), ctrl = f.it.controls[j];
      const cur = (st.answers[id] || E.blankAnswer(f.it))[j];
      let v;
      if (ctrl.type === 'check') v = cur ? 0 : 1;
      else if (ctrl.type === 'tier') v = cur === +b.dataset.v ? -1 : +b.dataset.v;
      else v = Math.max(0, Math.min(ctrl.max, (cur || 0) + +b.dataset.d));
      commit({ answers: E.setControl(R, st.answers, id, j, v), basics: st.basics });
    },
    sys(b) {
      const R = rules(), st = stateNow(), id = b.dataset.id, j = +b.dataset.j, k = +b.dataset.b, f = E.findItem(R, id);
      const cur = (st.answers[id] || E.blankAnswer(f.it))[j] || 0, bit = Math.pow(2, k), on = Math.floor(cur / bit) % 2 === 1;
      commit({ answers: E.setControl(R, st.answers, id, j, on ? cur - bit : cur + bit), basics: st.basics });
    },
    rst(b) { const st = stateNow(); commit({ answers: E.resetItem(st.answers, b.dataset.id), basics: st.basics }); },
    basic(b) { const st = stateNow(); const nb = Object.assign({}, st.basics); if (b.checked) nb[b.dataset.id] = true; else delete nb[b.dataset.id]; commit({ answers: st.answers, basics: nb }); },
    basicAll(b) {
      const R = rules(), st = stateNow(), ind = R.indicators.find((i) => i.id === b.dataset.id); if (!ind) return;
      const nb = Object.assign({}, st.basics); E.basicRules(ind, E.catIndex(R, st.cat)).forEach((r) => { if (b.checked) nb[r.id] = true; else delete nb[r.id]; });
      commit({ answers: st.answers, basics: nb });
    },
    async fill0() {
      const R = rules();
      
      const st = stateNow();
      applyAnswers(E.fillAnswers(R, st.cat, { includeBonus: false }), E.basicsAll(R, st.cat), '已填入「不含加分」情境');
    },
    async fill1() {
      const R = rules();
      
      const st = stateNow();
      applyAnswers(E.fillAnswers(R, st.cat, { includeBonus: true }), E.basicsAll(R, st.cat), '已填入「全加分」情境');
    },
    async clear() {
      
      applyAnswers({}, {}, '已清除目前版本與類別的勾選');
    },
    undo() {
      if (!undo || undo.id !== proj().id) return toast('沒有可復原的操作');
      const u = undo; undo = null;
      const p = proj();
      const R = RULES[u.version];
      db.projects[p.id] = S.withSlice(R, p, u.cat, u.slice);
      if (p.version !== u.version || p.cat !== u.cat) db.projects[p.id] = Object.assign({}, db.projects[p.id], { version: u.version, cat: u.cat });
      ui.sg.clear(); scheduleSave(); render(); toast('已復原');
    },
    fold() { ui.fold = !ui.fold; render(); },
    advice() { actions.advPreset(); },
    advClose() { ui.advice = null; render(); },
    advPreset() {
      const R = rules(), P = presetOf(R), st = stateNow(); if (!P) return;
      applyAnswers(Object.assign({}, P.answers), E.basicsAll(R, st.cat), '已套用 ' + F(P.total) + ' 分建議組合（試算情境）');
      Object.keys(P.answers).forEach((i) => ui.sg.add(i)); R.indicators.forEach((i) => ui.open.add(i.id)); render();
    },
    advApply(b) { const st = stateNow(); applyAnswers(A.applyItem(rules(), st.answers, b.dataset.id), st.basics, '已套用 ' + b.dataset.id + '（試算情境）'); ui.sg.add(b.dataset.id); render(); },
    advApplyAll() {
      const st = stateNow(), sg = A.suggest(rules(), st, { target: ui.advice && ui.advice.target });
      const ids = sg.plan.map((x) => x.id);
      applyAnswers(A.applyMany(rules(), st.answers, ids), st.basics, '已套用 ' + ids.length + ' 項建議（試算情境）');
      ids.forEach((i) => ui.sg.add(i)); rules().indicators.forEach((ind) => ui.open.add(ind.id)); render();
    },
    cases() { casesDlg(); },
    projects() { projectsDlg(); },
    async pNew() {
      const inp = $('#newName'); const name = inp ? inp.value : '';
      const p = S.newProject(name || '新專案', proj().version);
      db.projects[p.id] = p; db.active = p.id; ui.open.clear(); ui.sg.clear(); undo = null; scheduleSave(); render(); closeDlg('dlg'); toast('已建立專案「' + p.name + '」');
    },
    async pSwitch(b) { if (!(await confirmIfUnsaved())) return; db.active = b.dataset.id; ui.open.clear(); ui.sg.clear(); undo = null; scheduleSave(); render(); closeDlg('dlg'); toast('已切換到「' + proj().name + '」'); },
    async pRename(b) { const p = db.projects[b.dataset.id]; const n = await ask({ title: '重新命名專案', input: { label: '專案名稱', value: p.name } }); if (!n) return; db.projects[p.id] = Object.assign({}, p, { name: n, updated: Date.now() }); scheduleSave(); render(); projectsDlg(); },
    async pDelete(b) {
      const ids = Object.keys(db.projects);
      if (ids.length <= 1) return toast('至少需保留一個專案');
      const p = db.projects[b.dataset.id];
      if (!(await ask({ title: '刪除專案', body: '<p>確定刪除「' + esc(p.name) + '」？其所有版本與類別的勾選都會一併刪除，無法復原。</p>', ok: '刪除', danger: true }))) return;
      delete db.projects[p.id];
      if (db.active === p.id) db.active = Object.keys(db.projects)[0];
      undo = null; scheduleSave(); render(); projectsDlg();
    },
    export() { closeDlg('dlg'); exportDlg(); },
    copyExp() { const t = $('#expTxt'); t.select(); try { navigator.clipboard.writeText(t.value).then(() => toast('已複製'), () => { document.execCommand('copy'); toast('已複製'); }); } catch (e) { try { document.execCommand('copy'); toast('已複製'); } catch (e2) { toast('請手動複製文字框內容'); } } },
    dlExp() { download((proj().name || 'project').replace(/[\\/:*?"<>|]/g, '_') + '.sbs.json', $('#expTxt').value); },
    import() { closeDlg('dlg'); importDlg(); },
    async doImport() {
      const txt = $('#impTxt').value.trim(), msg = $('#impMsg');
      if (!txt) { msg.innerHTML = '<div class="errb">請先選擇檔案或貼上內容。</div>'; return; }
      const r = S.parseImport(txt, RULES);
      if (!r.ok) { msg.innerHTML = '<div class="errb"><b>無法匯入，現有資料未被改動：</b><ul>' + r.errors.map((e) => '<li>' + esc(e) + '</li>').join('') + '</ul></div>'; return; }
      if (r.warnings.length && !(await ask({ title: '部分內容將被忽略', body: '<div class="warnb">' + r.warnings.slice(0, 8).map(esc).join('<br>') + (r.warnings.length > 8 ? '<br>…共 ' + r.warnings.length + ' 項' : '') + '</div><p>其餘資料可以匯入，仍要繼續嗎？</p>', ok: '繼續匯入' }))) return;
      let name = r.project.name; const names = Object.values(db.projects).map((p) => p.name); if (names.includes(name)) name += '（匯入）';
      r.project.name = name; db.projects[r.project.id] = r.project; db.active = r.project.id; ui.open.clear(); undo = null; scheduleSave(); render(); closeDlg('dlg'); toast('已匯入專案「' + name + '」');
    },
    print() { buildReport(); try { window.print(); } catch (e) { toast('此環境無法列印，請改用瀏覽器的列印功能'); } },
    help() { helpDlg(); },
  };

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    if (b.tagName === 'SELECT' || (b.tagName === 'INPUT' && b.type === 'checkbox')) return; // 由 change 事件處理
    const fn = actions[b.dataset.act];
    if (fn) fn(b);
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.act === 'ev') {
      const sl = sliceNow(), evd = Object.assign({}, sl.evidence), cur = Object.assign({ page: '', doc: '' }, evd[t.dataset.id]);
      cur[t.dataset.f] = t.value.trim(); if (cur.page || cur.doc) evd[t.dataset.id] = cur; else delete evd[t.dataset.id];
      db.projects[db.active] = S.withSlice(rules(), proj(), proj().cat, Object.assign({}, sl, { evidence: evd })); scheduleSave(); return;
    }
    if (t.dataset && t.dataset.act === 'basic') actions.basic(t);
    if (t.dataset && t.dataset.act === 'basicAll') actions.basicAll(t);
    if (t.dataset && t.dataset.act === 'advTarget') { ui.advice = { target: t.value === '' ? null : +t.value }; render(); }
  });

  // ---------------------------------------------------------------- 啟動
  if (db.theme) document.documentElement.dataset.theme = db.theme;
  // 版本說明：滑鼠移上、鍵盤聚焦或點一下顯示（手機用點的），點別處關閉
  (() => {
    const w = document.querySelector('.vwrap'), btn = $('#verBtn');
    btn.addEventListener('click', (e) => { e.stopPropagation(); const o = w.classList.toggle('open'); btn.setAttribute('aria-expanded', String(o)); });
    document.addEventListener('click', () => { w.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { w.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); btn.blur(); } });
  })();
  renderNote(); render();
  if (loaded.error) toast(loaded.error);
  if (!persistent) toast('此瀏覽器無法使用 localStorage，資料不會保留');
  window.SBS_APP = { get db() { return db; }, render, ui }; // 供測試使用
})();

</script>
</body>
</html>
